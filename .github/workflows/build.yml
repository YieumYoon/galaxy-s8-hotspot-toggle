name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Check for private data and forbidden files
        run: ./scripts/privacy-check.sh

      - name: Build APK
        run: ./scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-s8-hotspot-toggle
          path: dist/galaxy-s8-hotspot-toggle.apk
          if-no-files-found: error
