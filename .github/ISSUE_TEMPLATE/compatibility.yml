name: Compatibility report
description: Report a test result without sharing private device information
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Do not post IMEIs, serial numbers, phone numbers, MAC addresses, SSIDs,
        account data, full logs, system dumps, or extracted firmware files.

  - type: input
    id: model
    attributes:
      label: Public model number
      description: Example: SM-G955U. Do not enter the device serial number.
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "9"
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Firmware build number
      description: The public build number from Software information, not a serial number.
    validations:
      required: true

  - type: input
    id: csc
    attributes:
      label: CSC or carrier
      description: Optional; examples are VZW, XAA, or Verizon.

  - type: dropdown
    id: preflight
    attributes:
      label: Component preflight
      options:
        - Passed
        - Reported incompatible
    validations:
      required: true

  - type: dropdown
    id: start
    attributes:
      label: Start result
      options:
        - Hotspot started
        - Timed out or failed
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: stop
    attributes:
      label: Stop result
      options:
        - Hotspot stopped without a dialog
        - Samsung confirmation dialog appeared
        - Timed out or failed
        - Not tested
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Redacted notes
      description: Keep this minimal and remove all personal or device identifiers.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal, subscriber, network, account, and unique device identifiers.
          required: true
        - label: I did not attach proprietary Samsung APK or firmware files.
          required: true
